name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.7.0). Uses latest tag if empty."
        required: false
        type: string
      dry_run_certs:
        description: "Preview iOS dev cert cleanup without revoking. Use once to eyeball which certs the heuristic would target."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: oven-sh/setup-bun@v2

      - name: Download SQLite amalgamation
        working-directory: libtaijobi/vendor
        run: |
          curl -fsSL https://www.sqlite.org/2026/sqlite-amalgamation-3520000.zip -o sqlite.zip
          unzip -o sqlite.zip
          cp sqlite-amalgamation-3520000/sqlite3.c sqlite3.c
          cp sqlite-amalgamation-3520000/sqlite3.h sqlite3.h

      - name: Build data binaries (CEDICT + decomposition + strokes)
        run: ./scripts/build-all-data.sh

      - name: Zig fmt check
        working-directory: libtaijobi
        run: zig fmt --check src/

      - name: Zig tests
        working-directory: libtaijobi
        run: zig build test

      - name: Install web dependencies
        working-directory: taijobi-web
        run: bun install --frozen-lockfile

      - name: oxfmt check
        working-directory: taijobi-web
        run: bunx oxfmt --check

      - name: oxlint
        working-directory: taijobi-web
        run: bunx oxlint

      - name: svelte-check
        working-directory: taijobi-web
        run: bun run check

  build-and-deploy-web:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: oven-sh/setup-bun@v2

      - name: Download SQLite amalgamation
        working-directory: libtaijobi/vendor
        run: |
          curl -fsSL https://www.sqlite.org/2026/sqlite-amalgamation-3520000.zip -o sqlite.zip
          unzip -o sqlite.zip
          cp sqlite-amalgamation-3520000/sqlite3.c sqlite3.c
          cp sqlite-amalgamation-3520000/sqlite3.h sqlite3.h

      - name: Build WASM
        run: ./scripts/build-wasm.sh

      - name: Strip .bin files from deploy (served from R2 via .github/workflows/data-upload.yml)
        run: rm -f taijobi-web/static/data/*.bin

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: libtaijobi-wasm
          path: taijobi-web/static/libtaijobi.wasm

      - name: Install web dependencies
        working-directory: taijobi-web
        run: bun install --frozen-lockfile

      - name: Build web
        working-directory: taijobi-web
        run: bun run build

      - name: Deploy to Cloudflare Workers
        working-directory: taijobi-web
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  build-libtaijobi-ios:
    # Pinned to macos-15 because Zig 0.15.2 hit a libSystem linker break
    # on macos-26 (missing __availability_version_check). Likely fixed in
    # 0.16, but the XCFramework is portable across SDK versions so the
    # pin costs nothing and keeps the upgrade narrowly scoped.
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: oven-sh/setup-bun@v2

      - name: Download SQLite amalgamation
        working-directory: libtaijobi/vendor
        run: |
          curl -fsSL https://www.sqlite.org/2026/sqlite-amalgamation-3520000.zip -o sqlite.zip
          unzip -o sqlite.zip
          cp sqlite-amalgamation-3520000/sqlite3.c sqlite3.c
          cp sqlite-amalgamation-3520000/sqlite3.h sqlite3.h

      - name: Build iOS XCFramework
        # No data-binary build step here on purpose — the production iOS
        # static lib loads dictionaries at runtime via hanzi_load_cedict /
        # hanzi_load_decomp / hanzi_load_strokes, same as WASM. The
        # @embedFile calls are gated by builtin.is_test so they only fire
        # when zig build test runs in the check job, where the bins do
        # get built. Mirrors the PWA install-on-demand UX.
        run: ./scripts/build-ios.sh

      - name: Zip XCFramework
        working-directory: libtaijobi/build-ios
        run: zip -r libtaijobi.xcframework.zip libtaijobi.xcframework

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: libtaijobi-ios
          path: libtaijobi/build-ios/libtaijobi.xcframework.zip

  build-ios:
    needs: build-libtaijobi-ios
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Verify App Store Connect secrets are set
        # Fail fast with a clear message instead of letting xcodebuild
        # crash with `-authenticationKeyID is required when specifying
        # -authenticationKeyPath` when the secret is empty.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          missing=()
          [ -z "$ASC_KEY_ID" ] && missing+=("ASC_KEY_ID")
          [ -z "$ASC_ISSUER_ID" ] && missing+=("ASC_ISSUER_ID")
          [ -z "$ASC_KEY_CONTENT" ] && missing+=("ASC_KEY_CONTENT")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing App Store Connect secrets: ${missing[*]}"
            echo "Set them via: gh secret set ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_CONTENT"
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      # Needed by the cert-cleanup step at the bottom of the job. Cheap
      # (~3s) and we depend on it only for one ~150-line TS script, but
      # without it `bun run scripts/revoke-ci-certs.ts` exits 127.
      - uses: oven-sh/setup-bun@v2

      - name: Show toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          xcrun --show-sdk-version --sdk iphoneos

      - name: Download XCFramework
        uses: actions/download-artifact@v8
        with:
          name: libtaijobi-ios
          path: artifacts

      - name: Unpack XCFramework
        run: |
          mkdir -p taijobi-ios/Frameworks
          unzip -o artifacts/libtaijobi.xcframework.zip -d taijobi-ios/Frameworks/

      - name: Bump build number
        working-directory: taijobi-ios
        run: |
          BUILD_NUMBER=$(date +%s)
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: $BUILD_NUMBER/g" project.yml
          echo "Build number: $BUILD_NUMBER"

      - name: Generate Xcode project
        run: ./scripts/gen-xcodeproj.sh

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project taijobi-ios/taijobi.xcodeproj \
            -scheme taijobi \
            -destination "generic/platform=iOS" \
            -archivePath build/taijobi.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -quiet

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/taijobi.xcarchive \
            -exportOptionsPlist taijobi-ios/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # Apple caps Development certs at 2 per account. Every CI run mints
      # a fresh one via -allowProvisioningUpdates and never reuses it, so
      # without cleanup we hit the cap every ~2 unattended releases and
      # the next build dies with "Choose a certificate to revoke." Walk
      # the portal here and drop anything created in the last 24h
      # (= certs whose 1-year validity is still >364 days out — see the
      # script for why this heuristic is safe for human-owned certs).
      # `if: always()` so a failed upload still cleans up its cert.
      - name: Revoke this run's iOS Development cert
        if: always()
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # workflow_dispatch toggle (false on tag-pushed runs since
          # `inputs.dry_run_certs` is null there → `&& '1' || ''` → '').
          # Set to true via `gh workflow run ... -f dry_run_certs=true`
          # to log candidates without actually revoking. Useful once for
          # first-run verification.
          DRY_RUN: ${{ inputs.dry_run_certs && '1' || '' }}
        run: bun run scripts/revoke-ci-certs.ts

  deploy-sync:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - uses: oven-sh/setup-bun@v2

      - name: Download SQLite amalgamation
        working-directory: libtaijobi/vendor
        run: |
          curl -fsSL https://www.sqlite.org/2026/sqlite-amalgamation-3520000.zip -o sqlite.zip
          unzip -o sqlite.zip
          cp sqlite-amalgamation-3520000/sqlite3.c sqlite3.c
          cp sqlite-amalgamation-3520000/sqlite3.h sqlite3.h

      - name: Build compact MCP WASM
        working-directory: libtaijobi
        run: |
          zig build -Dmcp=true --release=small
          cp zig-out/bin/libtaijobi-mcp.wasm ../taijobi-sync/libtaijobi-mcp.wasm

      - name: Install sync worker dependencies
        working-directory: taijobi-sync
        run: bun install --frozen-lockfile

      - name: Deploy sync worker
        working-directory: taijobi-sync
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  release:
    needs: [build-and-deploy-web, build-libtaijobi-ios, build-ios, deploy-sync]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download WASM artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: libtaijobi-wasm
          path: artifacts/libtaijobi-wasm

      - name: Download iOS artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: libtaijobi-ios
          path: artifacts/libtaijobi-ios

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Resolve tag: from input (manual dispatch), GITHUB_REF (tag push), or latest tag
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG=$(git tag -l --sort=-v:refname | head -1)
          fi

          # Find the last tag that has a GitHub release (skips failed CI tags)
          PREV_TAG=""
          for t in $(git tag -l --sort=-v:refname | tail -n +2); do
            if gh release view "$t" --json tagName >/dev/null 2>&1; then
              PREV_TAG="$t"
              break
            fi
          done

          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG"..HEAD \
              | grep -vE '^- (release|chore|ci|build): ' || echo "- Version bump")
          else
            NOTES=$(git log --pretty=format:"- %s" HEAD~20..HEAD \
              | grep -vE '^- (release|chore|ci|build): ' || echo "- Version bump")
          fi

          echo "$NOTES" > release-notes.md

          # Collect available artifacts (each gated so a missing one just gets skipped)
          ASSETS=()
          WASM=$(find artifacts/libtaijobi-wasm -name 'libtaijobi.wasm' -type f 2>/dev/null | head -1)
          [ -n "$WASM" ] && ASSETS+=("$WASM")
          [ -f artifacts/libtaijobi-ios/libtaijobi.xcframework.zip ] && ASSETS+=(artifacts/libtaijobi-ios/libtaijobi.xcframework.zip)

          if [ ${#ASSETS[@]} -eq 0 ]; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              "${ASSETS[@]}"
          fi
