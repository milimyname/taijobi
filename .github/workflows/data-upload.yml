name: Dictionary Data Build

# Builds the dictionary binary files (cedict, decomp, strokes, endict, dedict)
# and publishes them as the `dictionaries` workflow artifact. CI does the
# multi-GB Wiktextract downloads so a laptop doesn't have to. Shipping them is
# local: `make data-fetch` (downloads the latest artifact into
# taijobi-web/static/data) then `make deploy-data` (rsync to the VPS).
# Until 2026-10 this uploaded to Cloudflare R2.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # NOTE: deliberately do not list this workflow file itself. Editing the
    # workflow config should not cause a full 80MB re-upload of dictionary
    # data that hasn't changed. Use `gh workflow run data-upload.yml` (or
    # the GitHub UI) to trigger manually after a config change.
    paths:
      - "scripts/build-cedict.sh"
      - "scripts/build-decomp.sh"
      - "scripts/build-strokes.sh"
      - "scripts/build-endict.sh"
      - "scripts/build-dedict.sh"
      - "scripts/build-all-data.sh"
      - "scripts/compile-cedict.ts"
      - "scripts/compile-decomp.ts"
      - "scripts/compile-strokes.ts"
      - "scripts/compile-wiktdict.ts"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Cache Wiktextract JSONL
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/
          key: wiktextract-v1

      - name: Build CEDICT + decomposition + strokes
        run: ./scripts/build-all-data.sh

      - name: Build EN/DE dictionaries
        run: |
          ./scripts/build-endict.sh
          ./scripts/build-dedict.sh

      - name: Stage all .bin files for upload
        run: |
          mkdir -p upload/data
          cp libtaijobi/src/cedict.bin   upload/data/
          cp libtaijobi/src/decomp.bin   upload/data/
          cp libtaijobi/src/strokes.bin  upload/data/
          cp taijobi-web/static/data/endict.bin upload/data/
          cp taijobi-web/static/data/dedict.bin upload/data/
          ls -lh upload/data/

      # Guard against the next silent OOM. The web WASM holds every dict in
      # a single fixed-size persistent allocator declared in
      #   libtaijobi/src/root.zig  →  `const PERSIST_SIZE = 256 * 1024 * 1024;`
      # plus a static `[PERSIST_SIZE]u8` backing buffer. That arena is
      # bump-allocated at WASM init and never grows — `hanzi_persist_alloc`
      # just returns null when the next dict doesn't fit, which leaves the
      # dict silently unloaded and the user staring at a stuck "update"
      # banner with no useful error (see the May 2026 endict 19→141MB
      # incident).
      #
      # The per-file caps below pre-empt that scenario at deploy time. They
      # must sum to less than PERSIST_SIZE with ~30MB headroom for FBA
      # round-trips + future JMdict/KDICT slots. If a cap trips, you have
      # three options in increasing order of effort:
      #
      #   1. Tighten compile-wiktdict.ts's MAX_* limits (cap senses /
      #      examples / etymology length) — keeps total entry count, less
      #      info per entry.
      #   2. Cap total entry count in compile-wiktdict.ts (drop the long
      #      tail of rare words) — fewer entries, full info per entry.
      #   3. Bump PERSIST_SIZE in root.zig AND wasm max_memory in
      #      libtaijobi/build.zig in lock-step — same coverage, bigger
      #      initial WASM memory cost on every device.
      - name: Guard dict sizes vs WASM persist allocator
        run: |
          set -e
          # Budget (MB) per file. Tracks current production sizes with
          # headroom; keep the SUM under PERSIST_SIZE − 30MB headroom.
          # Sum = 225 MB; PERSIST_SIZE = 256 MB → 31 MB headroom.
          declare -A LIMITS=(
            [cedict.bin]=15
            [decomp.bin]=3
            [strokes.bin]=12
            [endict.bin]=175
            [dedict.bin]=20
          )
          fail=0
          for f in upload/data/*.bin; do
            name=$(basename "$f")
            bytes=$(stat -c%s "$f")
            mb=$(( bytes / 1024 / 1024 ))
            limit=${LIMITS[$name]:-}
            if [ -z "$limit" ]; then
              echo "::warning::No budget defined for $name (${mb} MB) — add one to .github/workflows/data-upload.yml"
              continue
            fi
            if [ "$mb" -gt "$limit" ]; then
              echo "::error::$name = ${mb} MB > ${limit} MB budget. See the comment above this step in data-upload.yml for fix options (cap entries, tighten compile-wiktdict.ts MAX_*, or bump PERSIST_SIZE in libtaijobi/src/root.zig)."
              fail=1
            else
              echo "  $name: ${mb} MB / ${limit} MB budget ✓"
            fi
          done
          exit $fail

      - name: Upload dictionaries artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dictionaries
          path: upload/data/*.bin
          retention-days: 90
          compression-level: 0 # already dense binaries
