name: taijobi
options:
  bundleIdPrefix: com.taijobi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  defaultConfig: Release

targets:
  taijobi:
    type: application
    platform: iOS
    sources:
      - path: taijobi
        excludes:
          - "**/.DS_Store"
    entitlements:
      path: taijobi/taijobi.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.taijobi.app
    settings:
      base:
        SWIFT_VERSION: "5.10"
        PRODUCT_BUNDLE_IDENTIFIER: com.taijobi.app
        MARKETING_VERSION: "0.6.32"
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: W5N395VNYH
        # XCFramework currently only ships ios-arm64{,-simulator}. Restrict
        # x86_64 so Intel-Mac simulator builds don't fail link.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_OBJC_BRIDGING_HEADER: "taijobi/taijobi-Bridging-Header.h"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - '"Frameworks"'
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Frameworks/libtaijobi.xcframework/ios-arm64/Headers"
          - "$(PROJECT_DIR)/Frameworks/libtaijobi.xcframework/ios-arm64-simulator/Headers"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
    dependencies:
      - framework: Frameworks/libtaijobi.xcframework
        embed: false
    info:
      path: taijobi/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: taijobi
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

schemes:
  taijobi:
    build:
      targets:
        taijobi: all
    run:
      config: Debug
